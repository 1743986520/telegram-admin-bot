services:
  telegram-admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-admin-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-admin-bot-proxy:
    image: caddy:2-alpine
    container_name: telegram-admin-bot-proxy
    restart: unless-stopped
    depends_on:
      telegram-admin-bot:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
